name: AlphaShield Live Runner

on:
  schedule:
    - cron: "15 5 * * 1-5"          # 12:15 ICT
  workflow_dispatch:
    inputs:
      force_run:
        description: "บังคับรันแม้วันนี้รันไปแล้ว (ข้าม idempotency guard)"
        type: boolean
        default: false
      shadow_mode:
        description: "Shadow: คำนวณ + log แต่ไม่เขียน state / ไม่ส่ง order"
        type: boolean
        default: false

# ⭐ กัน cron ชน manual dispatch — คิวรอ ไม่ kill run ที่กำลังเขียน state
concurrency:
  group: alphashield-live-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write                    # commit state.json + docs/data.enc

env:
  TZ: Asia/Bangkok
  PYTHON_VERSION: "3.11"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e . -r requirements.txt

      # ── Gate: test ต้องเขียวก่อนเสมอ ──────────────────────────
      - name: Run test suite (blocking)
        run: pytest -q --maxfail=1

      # ── State: cache = fast path, git = durable source of truth ──
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alphashield-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: alphashield-state-${{ github.ref_name }}-

      - name: Reconcile state (git wins over cache)
        run: |
          if [ -f .state/state.json ]; then
            echo "::notice::ใช้ state จาก git (durable)"
            cp .state/state.json state.json
          fi
          [ -f state.json ] && cat state.json || echo "::warning::cold start"

      # ── ⭐ Idempotency guard: กันรันซ้ำวันเดียวกัน ─────────────
      - name: Idempotency check
        id: guard
        run: |
          TODAY=$(TZ=Asia/Bangkok date +%F)
          LAST=$(python -c "
          import json,pathlib
          p=pathlib.Path('state.json')
          print(json.loads(p.read_text()).get('last_run_ict','')[:10] if p.exists() else '')
          " 2>/dev/null || echo "")
          echo "today=$TODAY last=$LAST"
          if [ "$LAST" = "$TODAY" ] && [ "${{ inputs.force_run }}" != "true" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "::warning::รันไปแล้ววันนี้ ($TODAY) — ข้ามเพื่อกัน strike/ladder ซ้ำ"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run AlphaShield
        if: steps.guard.outputs.should_run == 'true'
        id: bot
        env:
          DASHBOARD_PASSWORD:        ${{ secrets.DASHBOARD_PASSWORD }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY:           ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          SHADOW_MODE:               ${{ inputs.shadow_mode }}
          PYTHONUNBUFFERED:          "1"
        run: python bot.py

      # ── ⭐ Persist state ก่อน notify เสมอ (bot.py ต้องเรียงแบบนี้ด้วย) ──
      - name: Commit durable state
        if: steps.guard.outputs.should_run == 'true' && inputs.shadow_mode != true
        run: |
          mkdir -p .state && cp state.json .state/state.json
          git config user.name  "alphashield-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .state/state.json docs/data.enc
          git diff --staged --quiet || git commit -m "state: $(TZ=Asia/Bangkok date +%F) [skip ci]"
          git push

      - name: Save state cache
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alphashield-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            state.json
            logs/
          retention-days: 30
          if-no-files-found: ignore

      # ── Failure alert ─────────────────────────────────────────
      - name: Discord failure alert
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" \
            -d "{\"content\":\"🚨 **ALPHASHIELD RUN FAILED**\nBranch: \`${GITHUB_REF_NAME}\`\n$RUN\n⚠️ ไม่มีสัญญาณออก — สถานะพอร์ตคงเดิม\"}"